<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三阶盲拧 · 公式集</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/3x3.css">
    <link rel="stylesheet" href="css/blind.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <header class="app-header">
        <div class="header-title-wrap">
            <a href="index.html" class="home-link" title="返回主页">←</a>
            <h1>三阶盲拧 · 公式集</h1>
        </div>
        <div class="header-actions">
            <a href="blind-practice.html" class="btn btn-outline">公式训练</a>
            <button id="btn-toggle-3d" class="btn btn-outline">隐藏 3D</button>
            <button id="btn-add-top" class="btn btn-primary">+ 新建</button>
            <button id="btn-export" class="btn btn-outline">导出</button>
            <label for="file-import" class="btn btn-outline">导入</label>
            <input type="file" id="file-import" accept=".json" hidden>
        </div>
    </header>

    <div class="filter-bar">
        <span class="filter-label">分类</span>
        <div class="filter-chips" id="filter-main"></div>
    </div>

    <div class="filter-bar sub-filter-bar" id="sub-filter-bar">
        <span class="filter-label">分组</span>
        <div class="filter-sub-content" id="sub-filter-content"></div>
    </div>

    <main id="app" class="app-container"></main>

    <div class="bottom-create">
        <button id="btn-add-bottom" class="btn btn-create">+ 创建公式</button>
    </div>

    <footer class="app-footer">
        <p>中国传统色 · 角块 378 / 棱块 440 / 其他（翻棱、4e 等）</p>
    </footer>

    <script type="module" src="js/blind.js"></script>
</body>
</html>
