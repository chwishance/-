<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三阶公式集 · 魔方公式记忆</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/3x3.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <header class="app-header">
        <div class="header-title-wrap">
            <a href="index.html" class="home-link" title="返回主页">←</a>
            <h1>三阶 · 公式集</h1>
        </div>
        <div class="header-actions">
            <a href="3x3-practice.html" class="btn btn-outline">公式训练</a>
            <button id="btn-add-top" class="btn btn-primary">+ 新建三阶</button>
            <button id="btn-export" class="btn btn-outline">导出公式集</button>
            <label for="file-import" class="btn btn-outline">导入公式集</label>
            <input type="file" id="file-import" accept=".json" hidden>
        </div>
    </header>

    <div class="filter-bar">
        <span class="filter-label">按分组筛选</span>
        <div class="filter-chips" id="filter-chips"></div>
    </div>

    <main id="app" class="app-container"></main>

    <div class="bottom-create">
        <button id="btn-add-bottom" class="btn btn-create">+ 创建三阶</button>
    </div>

    <footer class="app-footer">
        <p>中国传统色 · 点击色块涂色 · 拖拽旋转 3D 模型 · 卡片分组可筛选</p>
    </footer>

    <script type="module" src="js/3x3.js"></script>
</body>
</html>
